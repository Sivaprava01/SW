<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#fff8f3;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-secondary": "#ffffff", "background": "#fff8f3", "secondary": "#b3291b", "secondary-container": "#fd5e49", "on-error-container": "#93000a", "on-error": "#ffffff", "error": "#ba1a1a", "on-secondary-container": "#610000", "error-container": "#ffdad6", "surface-container-high": "#f6e6d2", "inverse-primary": "#ffb690", "primary-fixed-dim": "#ffb690", "primary-container": "#f97316", "surface-container-low": "#fff1e3", "tertiary": "#9d4135", "surface-container-lowest": "#ffffff", "on-surface-variant": "#584237", "inverse-surface": "#382f22", "surface-dim": "#e8d8c4", "surface-bright": "#fff8f3", "tertiary-fixed": "#ffdad4", "outline": "#8c7164", "primary-fixed": "#ffdbca", "primary": "#9d4300", "surface-variant": "#f1e0cc", "on-primary": "#ffffff", "outline-variant": "#e0c0b1", "on-tertiary-fixed": "#410000", "on-tertiary": "#ffffff", "tertiary-fixed-dim": "#ffb4a8", "inverse-on-surface": "#ffeedb", "on-primary-fixed": "#341100", "secondary-fixed-dim": "#ffb4a8", "on-background": "#221a0e", "on-secondary-fixed-variant": "#900c05", "secondary-fixed": "#ffdad4", "surface-tint": "#9d4300", "on-primary-fixed-variant": "#783200", "on-secondary-fixed": "#410000", "on-tertiary-container": "#62160e", "surface": "#fff8f3", "on-surface": "#221a0e", "surface-co neHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script><style>

  </head><body class="bg-surface text-on-surface min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-space-xl">
<!-- Top Meta Bar: Step Pill + Skip Action -->
<div class="flex items-center justify-between py-space-sm">
<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container text-on-surface">
<span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
<span class="font-label-md text-label-md text-on-surface font-semibold tracking-wide uppercase" id="step-badge">Step 1 • Welcome</span>
</div>
<button class="min-h-[48px] px-3 py-2 text-on-surface-variant hover:text-primary active:scale-95 transition-transform flex items-center font-label-lg text-label-lg font-semibold" type="button">
      Skip Tour
    </button>
</div>
<!-- Segmented / Continuous Progress Bar -->
<div class="w-full bg-surface-variant h-2 rounded-full overflow-hidden mt-1 mb-space-md">
<div class="bg-primary-container h-full rounded-full transition-all duration-300 w-1/5" id="progress-bar-fill"></div>
</div>
<!-- Main Carousel Step Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-md relative overflow-hidden">
<!-- Visual Watermark Pattern -->
<div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-primary-fixed/20 pointer-events-none blur-2xl"></div>
<!-- Warm Hero Visual Container with Badges -->
<div class="w-full rounded-lg bg-surface-container-low p-space-md flex flex-col items-center justify-center relative overflow-hidden text-center">
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center shadow-sm mb-space-xs text-primary-container relative">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">star</span>
<div class="absolute -bottom-1 -right-1 bg-secondary text-on-secondary rounded-full p-1 flex items-center justify-center shadow">
<span class="material-symbols-outlined text-sm">favorite</span>
</div>
</div>
<!-- Authentic Representation Image Component -->
<div class="w-full h-36 rounded-lg overflow-hidden my-space-xs relative shadow-sm">
<img class="w-full h-full object-cover" data-alt="Warm documentary photograph of an Indian village woman smiling gently while holding an entry-level smartphone in her sunlit courtyard, vibrant cotton saree with saffron and marigold tones, soft natural lighting, empowering financial independence feel." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBsj0tYnm-j_ZRjSDbkb3GOHua881avYaJwg1xGC-Ljmr4VSMMkB8ANibRnu-tPq2MonM7-TN2qzMygxVBpl8rQVZWdOREPqdJwKnEeVgu6kulGkeidg7NxZFgPZmGc0Z4aIFv7bb8KdqMYRuRolN1laq5RTKCUu2y-U_RYA9BOhc93k1k18cOoka8srdtAInkEPBe6HL6AgSKNtC6gEkM_OMHddToLp9dzlM3yjcWAxd1E9hf4bHbjEg">
<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/60 via-transparent to-transparent flex items-end p-2.5">
<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface/90 text-primary font-label-sm text-label-sm font-bold shadow-sm">
<span class="material-symbols-outlined text-xs">verified_user</span>
            Sakhi Trust Seal
          </span>
</div>
</div>
</div>
<!-- Title & Editorial Subtitle -->
<div class="flex flex-col gap-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold leading-tight" id="step-title">
        Namaste, Sister!<br>Welcome to Sakhi
      </h1>
<p class="font-body-md text-body-md text-primary font-semibold" id="step-subtitle">
        Your personal, trustworthy financial companion
      </p>
</div>
<!-- Friendly Plain Language Body Copy -->
<div class="font-body-md text-body-md text-on-surface-variant leading-relaxed">

</div>
<!-- Audio Preview Pill with Play Button -->
<div class="w-full rounded-lg bg-surface-container p-space-sm flex items-center justify-between">
<div class="flex items-center gap-space-sm min-w-0">
<button aria-label="Listen to voice guide" class="w-12 h-12 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-sm active:scale-90 transition-transform shrink-0" id="voice-btn" type="button">
<span class="material-symbols-outlined text-2xl">volume_up</span>
</button>
<div class="flex flex-col min-w-0">
<span class="font-label-lg text-label-lg text-on-surface font-bold truncate">Listen to Sakhi</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Telugu • Hindi • Odia • Marathi</span>
</div>
</div>
<span class="px-2.5 py-1 rounded-full bg-surface-container-high text-primary font-label-sm text-label-sm font-bold shrink-0">
        18 sec
      </span>
</div>
<!-- Reassurance Tip Box -->

</div>
<!-- Interactive Steps Breadcrumb / Quick Preview -->
<div class="my-space-md">
<div class="flex items-center justify-between mb-space-xs px-1">
<span class="font-label-md text-label-md text-on-surface-variant font-semibold">Your 5-Step Path</span>
<span class="font-body-sm text-body-sm text-primary font-bold" id="step-counter">1 of 5</span>
</div>
<!-- Horizontal Scroll Step Indicators with Touch Targets -->
<div class="grid grid-cols-5 gap-1.5 w-full">
<button class="step-pill flex flex-col items-center gap-1 p-2 rounded-lg bg-primary-container text-on-primary transition-all" onclick="goToStep(0)">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">handshake</span>
<span class="font-label-sm text-[10px] uppercase font-bold tracking-tight">Welcome</span>
</button>
<button class="step-pill flex flex-col items-center gap-1 p-2 rounded-lg bg-surface-container text-on-surface-variant active:scale-95 transition-all" onclick="goToStep(1)">
<span class="material-symbols-outlined text-lg">account_balance_wallet</span>
<span class="font-label-sm text-[10px] uppercase font-bold tracking-tight">Money</span>
</button>
<button class="step-pill flex flex-col items-center gap-1 p-2 rounded-lg bg-surface-container text-on-surface-variant active:scale-95 transition-all" onclick="goToStep(2)">
<span class="material-symbols-outlined text-lg">savings</span>
<span class="font-label-sm text-[10px] uppercase font-bold tracking-tight">Journey</span>
</button>
<button class="step-pill flex flex-col items-center gap-1 p-2 rounded-lg bg-surface-container text-on-surface-variant active:scale-95 transition-all" onclick="goToStep(3)">
<span class="material-symbols-outlined text-lg">assured_workload</span>
<span class="font-label-sm text-[10px] uppercase font-bold tracking-tight">Schemes</span>
</button>
<button class="step-pill flex flex-col items-center gap-1 p-2 rounded-lg bg-surface-container text-on-surface-variant active:scale-95 transition-all" onclick="goToStep(4)">
<span class="material-symbols-outlined text-lg">forum</span>
<span class="font-label-sm text-[10px] uppercase font-bold tracking-tight">Companion</span>
</button>
</div>
</div>
<!-- Bottom Interactive Footer Controls -->
<div class="w-full flex items-center gap-3 pt-space-xs">
<!-- Back Button -->
<button class="min-h-[52px] px-5 rounded-lg bg-surface-container text-on-surface-variant opacity-40 font-headline-sm text-body-md font-bold flex items-center justify-center gap-1 active:scale-95 transition-all" disabled="" id="prev-btn" onclick="prevStep()" type="button">
<span class="material-symbols-outlined text-xl">arrow_back</span>
<span class="">Back</span>
</button>
<!-- Next Step CTA -->
<button class="flex-1 min-h-[52px] px-6 rounded-lg bg-primary-container text-on-primary font-headline-sm text-body-lg font-bold flex items-center justify-center gap-2 shadow-md hover:opacity-95 active:scale-[0.98] transition-all" id="next-btn" onclick="nextStep()" type="button">
<span id="next-label" class="">Next Step</span>
<span class="material-symbols-outlined text-2xl">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function() {
    const stepsData = [
      {
        step: 1,
        name: "Welcome",
        title: "Namaste, Sister!<br/>Welcome to Sakhi",
        subtitle: "Your personal, trustworthy financial companion",
        body: "Sakhi is like an elder sister who sits with you, counts every rupee from your crop, dairy, or handloom work, and protects your household dreams. Absolutely zero confusing English bank jargon.",
        tip: "<strong class='text-on-surface font-bold'>100% Private:</strong> Everything is calculated automatically and saved securely on your phone. No secret fees.",
        progress: "20%"
      },
      {
        step: 2,
        name: "My Money",
        title: "Track Cash &amp;<br/>SHG Group Dues",
        subtitle: "One-tap ledger for income, sales & micro-loans",
        body: "Record daily earnings from milk sales, stitching, or local market stalls. Never lose track of monthly Self-Help Group (SHG) repayments or neighbor loans.",
        tip: "<strong class='text-on-surface font-bold'>Zero Math Stress:</strong> Simply speak your expense or type numbers. Sakhi balances the passbook.",
        progress: "40%"
      },
      {
        step: 3,
        name: "Journey",
        title: "Save For Dreams,<br/>Big &amp; Small",
        subtitle: "Gold coins, daughter's schooling, or shop tools",
        body: "Set targets like saving ₹20 a day into your piggy bank or gold locker. Watch your savings jar fill up like grains of rice with every milestone.",
        tip: "<strong class='text-on-surface font-bold'>Visual Reminders:</strong> Receive gentle reminders in your mother tongue so your family goals stay protected.",
        progress: "60%"
      },
      {
        step: 4,
        name: "Schemes",
        title: "Government Benefits<br/>Made For You",
        subtitle: "Lakhpati Didi, PM Awas, Mudra, &amp; Sukanya",
        body: "Know which direct bank benefit transfers (DBT) and subsidy schemes you qualify for without having to pay any middleman or tout at the taluk office.",
        tip: "<strong class='text-on-surface font-bold'>Direct Benefits:</strong> Sakhi checks eligibility instantly with basic ration card or SHG details.",
        progress: "80%"
      },
      {
        step: 5,
        name: "AI Companion",
        title: "Speak Naturally,<br/>Anytime You Need",
        subtitle: "Your 24/7 audio assistant in your dialect",
        body: "Ask Sakhi questions just like speaking with your village counselor: 'How much did I save this month?' or 'When is my next SHG installment due?'",
        tip: "<strong class='text-on-surface font-bold'>Voice Ready:</strong> Tap the mic button anywhere in the app to speak instead of reading or typing.",
        progress: "100%"
      }
    ];

    let currentStep = 0;

    window.goToStep = function(index) {
      if (index < 0 || index >= stepsData.length) return;
      currentStep = index;
      renderStep();
    };

    window.nextStep = function() {
      if (currentStep < stepsData.length - 1) {
        currentStep++;
        renderStep();
      } else {
        alert("🎉 Tour completed! Welcome inside Sakhi.");
      }
    };

    window.prevStep = function() {
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    };

    function renderStep() {
      const data = stepsData[currentStep];
      
      document.getElementById('step-badge').innerText = `Step ${data.step} • ${data.name}`;
      document.getElementById('progress-bar-fill').style.width = data.progress;
      document.getElementById('step-title').innerHTML = data.title;
      document.getElementById('step-subtitle').innerText = data.subtitle;
      document.getElementById('step-body').innerText = data.body;
      document.getElementById('step-tip').innerHTML = data.tip;
      document.getElementById('step-counter').innerText = `${data.step} of ${stepsData.length}`;

      const prevBtn = document.getElementById('prev-btn');
      if (currentStep === 0) {
        prevBtn.disabled = true;
        prevBtn.classList.add('opacity-40');
      } else {
        prevBtn.disabled = false;
        prevBtn.classList.remove('opacity-40');
      }

      const nextLabel = document.getElementById('next-label');
      if (currentStep === stepsData.length - 1) {
        nextLabel.innerText = "Start Using Sakhi";
      } else {
        nextLabel.innerText = "Next Step";
      }

      // Update pills
      const pills = document.querySelectorAll('.step-pill');
      pills.forEach((p, idx) => {
        if (idx === currentStep) {
          p.className = 'step-pill flex flex-col items-center gap-1 p-2 rounded-lg bg-primary-container text-on-primary transition-all';
        } else {
          p.className = 'step-pill flex flex-col items-center gap-1 p-2 rounded-lg bg-surface-container text-on-surface-variant active:scale-95 transition-all';
        }
      });
    }

    // Interactive Voice Preview Toggle
    const voiceBtn = document.getElementById('voice-btn');
    if (voiceBtn) {
      let isPlaying = false;
      voiceBtn.addEventListener('click', function() {
        isPlaying = !isPlaying;
        if (isPlaying) {
          this.classList.add('animate-bounce', 'bg-secondary');
          this.innerHTML = '<span class="material-symbols-outlined text-2xl">pause</span>';
        } else {
          this.classList.remove('animate-bounce', 'bg-secondary');
          this.innerHTML = '<span class="material-symbols-outlined text-2xl">volume_up</span>';
        }
      });
    }
  })();
</script></main>

</body></html>
