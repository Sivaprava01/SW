version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sakhi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sakhi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sakhi_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sakhi_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sakhi_user} -d ${POSTGRES_DB:-sakhi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sakhi_net

  # ============================================================================
  # Sakhi FastAPI Backend Application
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sakhi_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      DATABASE_URL: postgresql://${POSTGRES_USER:-sakhi_user}:${POSTGRES_PASSWORD:-sakhi_secret_pass}@postgres:5432/${POSTGRES_DB:-sakhi_db}
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-1.5-flash
      AI_FALLBACK_MODE: "true"
      VOICE_TTS_PROVIDER: gtts
      VOICE_CACHE_ENABLED: "true"
      VOICE_AUDIO_CACHE_DIR: /app/audio_cache
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: 120
    ports:
      - "8000:8000"
    volumes:
      - audio_cache_data:/app/audio_cache
    networks:
      - sakhi_net

networks:
  sakhi_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  audio_cache_data:
    driver: local
